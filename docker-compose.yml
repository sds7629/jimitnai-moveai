services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moveai}
      POSTGRES_USER: ${POSTGRES_USER:-moveai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moveai}
    volumes:
      - db_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d convention: files run once, in filename
      # sort order, only on first container startup (empty data dir).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moveai} -d ${POSTGRES_DB:-moveai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://moveai_app:moveai_app@db:5432/moveai}
      APP_ENV: ${APP_ENV:-docker}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini_api}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    volumes:
      # Bind-mount source for live --reload during development.
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      # 브라우저(호스트)가 직접 호출하는 주소라 backend:8000이 아니라 localhost:8000이어야 한다 —
      # 컨테이너 내부 네트워크 이름은 프론트 컨테이너 자신이 아니라 브라우저 기준으로는 무의미하다.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      # Bind-mount source for live HMR during development.
      - ./frontend:/app
      # 컨테이너 내부에 npm install된 node_modules를 호스트 볼륨 마운트가 가리지 않도록 분리
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  frontend_node_modules:
